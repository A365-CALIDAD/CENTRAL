<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EQUIPO CALIDAD A365</title>
  <meta name="description" content="Plataforma central de BI y seguimiento de calidad de posventa">
  <link rel="icon" type="image/png" href="assets/img/favicon.png">
  <link rel="apple-touch-icon" href="assets/img/logo.png">
  <link rel="stylesheet" href="assets/css/central.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
</head>
<body>
  <div class="app" id="app">
    <aside class="sidebar" id="sidebar">
      <div class="marca">
        <img class="logo" src="assets/img/logo.png" alt="Área de Calidad" width="64" height="64">
        <div><b>CALIDAD</b><small>BI · Calidad de posventa</small></div>
      </div>
      <nav class="nav" id="nav" aria-label="Navegación principal"></nav>
      <div class="pie-sidebar" id="pie-sidebar"></div>
    </aside>
    <main class="main">
      <header class="topbar">
        <button class="btn btn-menu" id="btn-menu" aria-label="Abrir menú">☰</button>
        <img class="logo-top" src="assets/img/logo.png" alt="" width="36" height="36">
        <h1 id="titulo">CALIDAD</h1>
        <span class="meta" id="meta-datos"></span>
        <button class="btn" id="btn-tema" title="Cambiar tema" aria-label="Cambiar tema">◐</button>
      </header>
      <div class="contenido" id="vista">
        <div class="vacio">Cargando datos…</div>
      </div>
    </main>
    <nav class="nav-movil" id="nav-movil" aria-label="Navegación rápida">
      <a href="#/general" data-ruta="#/general"><span class="i">▦</span>General</a>
      <a href="#/kpis" data-ruta="#/kpis"><span class="i">≡</span>KPI</a>
      <a href="#/ver" data-ruta="#/ver"><span class="i">◫</span>Dashboards</a>
      <a href="#/seguimiento" data-ruta="#/seguimiento"><span class="i">⚑</span>Seguimiento</a>
      <button type="button" id="btn-menu-movil"><span class="i">⋯</span>Más</button>
    </nav>
  </div>

  <dialog id="dlg-seguimiento">
    <form method="dialog" id="form-seguimiento">
      <h2 style="margin:0;font-size:16px">Registrar seguimiento</h2>
      <div class="sub" id="dlg-contexto" style="color:var(--muted);font-size:12px"></div>
      <div class="campo"><label for="f-obs">Observación</label><textarea id="f-obs" required></textarea></div>
      <div class="campo"><label for="f-acc">Acción pendiente</label><textarea id="f-acc"></textarea></div>
      <div class="fila">
        <div class="campo"><label for="f-resp">Responsable</label><input id="f-resp"></div>
        <div class="campo"><label for="f-fecha">Fecha compromiso</label><input id="f-fecha" type="date"></div>
      </div>
      <div class="campo"><label for="f-estado">Estado</label>
        <select id="f-estado"><option value="abierta">Abierta</option><option value="en_curso">En curso</option><option value="cerrada">Cerrada</option></select>
      </div>
      <div class="pie">
        <button class="btn" value="cancelar" formnovalidate>Cancelar</button>
        <button class="btn primario" value="guardar">Guardar</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
